<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
  connect-src 'self' https://*.supabase.co;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
">
  <title>Gerenciar Usuários</title>
  <link rel="stylesheet" href="../css/css_barra_lateral.css">
  <link rel="stylesheet" href="../css/css_estilo_global_tabelas.css">
  <link rel="stylesheet" href="../css/css_unidade_detalhes.css">
  <link rel="stylesheet" href="../css/css_folgas_abonos.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
  <script src="../js/autenticacao.js" crossorigin="anonymous"></script>
  <script src="../js/barra_lateral.js" crossorigin="anonymous"></script>
  <script type="module" src="../js/navegacao_spa.js" crossorigin="anonymous"></script>
</head>
<body>

  <main class="conteudo-principal">
    <div class="cabecalho-pagina">
      <h1>Gerenciar Usuários</h1>
      <div class="acoes-cabecalho">
        <!-- CAMPO DE BUSCA COM LUPA SVG -->
        <div class="wrapper-campo-busca">
          <svg class="icone-lupa" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input 
            type="text" 
            id="campo_busca_usuario" 
            class="campo-busca" 
            placeholder="Buscar por e-mail ou perfil..."
          >
        </div>
        <button type="button" class="btn-principal" data-acao="abrir-modal-cadastro">+ Novo Usuário</button>
      </div>
    </div>

    <!-- TABELA PADRONIZADA DE USUÁRIOS -->
    <div class="container-tabela">
      <table>
        <thead>
          <tr>
            <th>E-mail</th>
            <th>Perfil / Regra</th>
            <th>Data de Criação</th>
            <th class="coluna-acoes">Ações</th>
          </tr>
        </thead>
        <tbody id="tabela_usuarios">
          <!-- Conteúdo inserido dinamicamente via JS -->
        </tbody>
      </table>
    </div>

    <!-- MODAL DE CADASTRO DE NOVO USUÁRIO -->
    <div id="modal_cadastro_usuario" class="modal-overlay oculto">
      <div class="modal-card">
        <span class="modal-fechar" data-acao="fechar-modal-cadastro">&times;</span>
        <h2>Cadastrar Novo Usuário</h2>
        <form id="form_cadastro_usuario" class="form-cadastro" style="margin-top: 16px;">
          <label><strong>E-mail:<span class="obrigatorio">*</span></strong></label>
          <input type="email" id="novo_email_usuario" placeholder="usuario@exemplo.com" required>

          <label><strong>Senha:<span class="obrigatorio">*</span></strong></label>
          <input type="password" id="nova_senha_usuario" placeholder="Digite a senha" required minlength="6">

          <label><strong>Perfil de Acesso:<span class="obrigatorio">*</span></strong></label>
          <select id="novo_role_usuario" required>
            <option value="funcionario">Funcionário</option>
            <option value="admin">Administrador</option>
          </select>

          <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px;">
            <button type="button" class="btn-secundario" data-acao="fechar-modal-cadastro">Cancelar</button>
            <button type="submit" class="btn-principal">Criar Usuário</button>
          </div>
        </form>
      </div>
    </div>
  </main>

</body>
</html>
