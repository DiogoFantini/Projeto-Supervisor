<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
  connect-src 'self' https://*.supabase.co;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
">
  <title>Detalhes da unidade</title>
  <link rel="stylesheet" href="../css/css_barra_lateral.css">
  <link rel="stylesheet" href="../css/css_estilo_global_tabelas.css">
  <link rel="stylesheet" href="../css/css_unidade_detalhes.css">
  <link rel="stylesheet" href="../css/css_folgas_abonos.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
  <script src="../js/autenticacao.js" crossorigin="anonymous"></script>
  <script src="../js/barra_lateral.js" crossorigin="anonymous"></script>
  <script type="module" src="../js/navegacao_spa.js" crossorigin="anonymous"></script>
</head>
<body>

  <main class="conteudo-principal">
    <a href="unidades.html" class="btn-voltar">← Voltar para unidades</a>
    
    <div class="cabecalho-pagina">
      <h1 id="titulo_unidade">Carregando...</h1>
      <div class="acoes-cabecalho">
        <input 
          type="text" 
          id="campo_busca_equipe" 
          class="campo-busca" 
          placeholder="Pesquisar equipes..."
        >
        <button type="button" class="btn-principal" data-acao="abrir-modal-vincular">+ Vincular equipe à unidade</button>
        <button type="button" id="btn_modo_desvincular" class="btn-perigo" data-acao="alternar-modo-desvincular">Desvincular equipe</button>
      </div>
    </div>

    <!-- DROPDOWN DE FUNCIONÁRIOS SEM EQUIPE -->
    <div id="container_dropdown_funcs" class="dropdown-funcionarios-container desativado">
      <button type="button" id="btn_dropdown_funcs" class="dropdown-toggle" data-acao="alternar-dropdown-funcs" disabled>
        <span id="titulo_dropdown_funcs">Funcionários sem equipe (0)</span>
        <span id="icone_seta" class="seta">▼</span>
      </button>
      
      <div id="conteudo_dropdown_funcs" class="dropdown-conteudo oculto">
        <div class="dropdown-busca-wrapper">
          <input 
            type="text" 
            id="campo_busca_funcs_sem_equipe" 
            class="campo-busca-dropdown" 
            placeholder="Pesquisar funcionário sem equipe..."
          >
        </div>
        <ul id="lista_funcs_sem_equipe" class="lista-funcs-dropdown">
          <!-- Preenchido via JS -->
        </ul>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Nome da equipe</th>
          <th>Descrição</th>
          <th id="coluna_acoes_cabecalho" class="coluna-remocao oculto">Ação</th>
        </tr>
      </thead>
      <tbody id="tabela_equipes_unidade"></tbody>
    </table>

    <!-- MODAL DE VINCULAR EQUIPE -->
    <div id="modal_vincular_equipe_unidade" class="modal-overlay oculto">
      <div class="modal-card">
        <span class="modal-fechar" data-acao="fechar-modal-vincular">&times;</span>
        <h2>Vincular equipe a esta unidade</h2>
        <form id="form_vincular_equipe_unidade" class="form-cadastro" style="margin-top: 16px;">
          <label><strong>Selecione a equipe registrada<span class="obrigatorio">*</span></strong></label>
          <select id="select_equipe_disponivel" required>
            <option value="">Carregando equipes...</option>
          </select>

          <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px;">
            <button type="button" class="btn-secundario" data-acao="fechar-modal-vincular">Cancelar</button>
            <button type="submit" class="btn-principal">Vincular equipe</button>
          </div>
        </form>
      </div>
    </div>

    <!-- MODAL DE CONFIRMAÇÃO DE DESVÍNCULO DE EQUIPE -->
    <div id="modal_confirmar_desvinculo_equipe" class="modal-overlay oculto">
      <div class="modal-card">
        <span class="modal-fechar" data-acao="fechar-modal-desvinculo">&times;</span>
        <h2>Confirmar desvínculo</h2>
        <p style="margin-top: 16px; color: #334155;">
          Tem certeza que deseja desvincular a equipe <strong id="nome_equipe_desvincular"></strong> desta unidade?
        </p>
        <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px;">
          <button type="button" class="btn-secundario" data-acao="fechar-modal-desvinculo">Cancelar</button>
          <button type="button" class="btn-perigo" data-acao="confirmar-desvinculo">Confirmar desvínculo</button>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
