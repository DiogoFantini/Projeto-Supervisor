<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
  connect-src 'self' https://*.supabase.co;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
">
  <title>Gestão de Unidades</title>
  <link rel="stylesheet" href="../css/css_barra_lateral.css">
  <link rel="stylesheet" href="../css/css_estilo_global_tabelas.css">
  <link rel="stylesheet" href="../css/css_unidade_detalhes.css">
  <link rel="stylesheet" href="../css/css_folgas_abonos.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
  <script src="../js/autenticacao.js" crossorigin="anonymous"></script>
  <script src="../js/barra_lateral.js" crossorigin="anonymous"></script>
  <script type="module" src="../js/navegacao_spa.js" crossorigin="anonymous"></script>
</head>
<body>

  <main class="conteudo-principal">
    <div class="cabecalho-pagina">
      <h1>Unidades</h1>
      <div class="acoes-cabecalho">
        <!-- CAMPO DE BUSCA COM LUPA SVG -->
        <div class="wrapper-campo-busca">
          <svg class="icone-lupa" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input 
            type="text" 
            id="campo_busca_unidade" 
            class="campo-busca" 
            placeholder="Buscar por unidade..."
          >
        </div>
        <button type="button" class="btn-principal" data-acao="abrir-modal-cadastro">+ Adicionar Unidade</button>
      </div>
    </div>

    <!-- CONTAINER OBRIGATÓRIO PARA A MOLDURA DA TABELA -->
    <div class="container-tabela">
      <table>
        <thead>
          <tr>
            <th>Nome da Unidade</th>
            <th>Endereço</th>
          </tr>
        </thead>
        <tbody id="tabela_unidades"></tbody>
      </table>
    </div>

    <!-- MODAL DE CADASTRO DE NOVA UNIDADE -->
    <div id="modal_cadastro_unidade" class="modal-overlay oculto">
      <div class="modal-card">
        <span class="modal-fechar" data-acao="fechar-modal-cadastro">&times;</span>
        <h2>Cadastrar Nova Unidade</h2>
        <form id="form_cadastro_unidade" class="form-cadastro" style="margin-top: 16px;">
          <label><strong>Nome da Unidade:<span class="obrigatorio">*</span></strong></label>
          <input type="text" id="novo_nome_unidade" placeholder="Ex: Unidade Central" required>

          <label><strong>Endereço Completo (opcional):</strong></label>
          <input type="text" id="novo_endereco_unidade" placeholder="Ex: Av. Brasil, 1000">

          <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px;">
            <button type="button" class="btn-secundario" data-acao="fechar-modal-cadastro">Cancelar</button>
            <button type="submit" class="btn-principal">Salvar Unidade</button>
          </div>
        </form>
      </div>
    </div>
  </main>

</body>
</html>
