<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Unidades</title>
  <link rel="stylesheet" href="../css/css_barra_lateral.css">
  <link rel="stylesheet" href="../css/css_estilo_global.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/barra_lateral.js"></script>
  <script src="../js/cadastrar_unidade.js" defer></script>
</head>
<body>

  <main class="conteudo-principal">
    <div class="cabecalho-pagina">
      <h1>Unidades</h1>
      <div class="acoes-cabecalho">
        <input 
          type="text" 
          id="campo_busca_unidade" 
          class="campo-busca" 
          placeholder="Buscar por nome, endereço ou equipe..." 
          oninput="filtrar_unidades()"
        >
        <button type="button" class="btn-principal" onclick="abrir_modal_cadastro()">+ Adicionar Unidade</button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Nome da Unidade</th>
          <th>Endereço</th>
        </tr>
      </thead>
      <tbody id="tabela_unidades"></tbody>
    </table>
  </main>

  <!-- MODAL DE CADASTRO DE NOVA UNIDADE -->
  <div id="modal_cadastro_unidade" class="modal-overlay oculto">
    <div class="modal-card">
      <span class="modal-fechar" onclick="fechar_modal_cadastro()">&times;</span>
      <h2>Cadastrar Nova Unidade</h2>
      <form id="form_cadastro_unidade" class="form-cadastro" style="margin-top: 16px;">
        <label><strong>Nome da Unidade:</strong></label>
        <input type="text" id="novo_nome_unidade" placeholder="Ex: Unidade Central" required>

        <label><strong>Endereço Completo:</strong></label>
        <input type="text" id="novo_endereco_unidade" placeholder="Ex: Av. Brasil, 1000" required>

        <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px;">
          <button type="button" style="background-color: #64748b; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;" onclick="fechar_modal_cadastro()">Cancelar</button>
          <button type="submit" class="btn-principal">Salvar Unidade</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
