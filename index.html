<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Funcionários</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 15px; background: #f8fafc; color: #0f172a; }
    h1, h2 { color: #1e293b; }
    .card { background: #ffffff; padding: 24px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 24px; }
    form { display: grid; gap: 12px; }
    input, button { padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    button { background: #0284c7; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #0369a1; }
    button.logout { background: #ef4444; float: right; padding: 8px 16px; margin-top: -10px; }
    button.logout:hover { background: #dc2626; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0; }
    th, td { border-bottom: 1px solid #e2e8f0; padding: 12px; text-align: left; }
    th { background: #f1f5f9; font-weight: 600; }
    .oculto { display: none; }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="secaoLogin" class="card">
    <h2>Entrar no Sistema</h2>
    <p>Faça Login</p>
    <form id="formLogin">
      <input type="email" id="loginEmail" placeholder="Seu E-mail" required>
      <input type="password" id="loginSenha" placeholder="Sua Senha" required>
      <button type="submit">Entrar</button>
    </form>
  </div>

  <!-- PAINEL PRINCIPAL (EXIBIDO APENAS APÓS AUTENTICAÇÃO) -->
  <div id="secaoPainel" class="oculto">
    <button id="btnSair" class="logout">Sair</button>
    <h1>Painel de Funcionários</h1>

    <div class="card">
      <h2>Cadastrar Novo Funcionário</h2>
      <form id="formFuncionario">
        <input type="text" id="nome" placeholder="Nome Completo" required>
        <input type="email" id="email" placeholder="E-mail" required>
        <input type="text" id="cargo" placeholder="Cargo" required>
        <input type="text" id="departamento" placeholder="Departamento" required>
        <button type="submit">Salvar Funcionário</button>
      </form>
    </div>

    <h2>Lista de Funcionários</h2>
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>E-mail</th>
          <th>Cargo</th>
          <th>Departamento</th>
        </tr>
      </thead>
      <tbody id="tabelaFuncionarios"></tbody>
    </table>
  </div>

  <script>
    const SUPABASE_URL = 'https://tnlsqmrluxugwialhrej.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_QaX1w_iFxZold_RnCkHtSA_z6hAbM-2';

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const secaoLogin = document.getElementById('secaoLogin');
    const secaoPainel = document.getElementById('secaoPainel');

    // Verificar se existe uma sessão ativa ao carregar a página
    async function verificarSessao() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (session) {
        secaoLogin.classList.add('oculto');
        secaoPainel.classList.remove('oculto');
        carregarFuncionarios();
      } else {
        secaoLogin.classList.remove('oculto');
        secaoPainel.classList.add('oculto');
      }
    }

    // Fazer Login
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginSenha').value;

      const { error } = await _supabase.auth.signInWithPassword({ email, password });
      if (error) {
        alert('Erro ao entrar: ' + error.message);
      } else {
        verificarSessao();
      }
    });

    // Fazer Logout
    document.getElementById('btnSair').addEventListener('click', async () => {
      await _supabase.auth.signOut();
      verificarSessao();
    });

    // Carregar lista de funcionários
    async function carregarFuncionarios() {
      const { data, error } = await _supabase.from('funcionarios').select('*').order('created_at', { ascending: false });
      if (error) {
        console.error('Erro ao buscar dados:', error);
        return;
      }

      const tbody = document.getElementById('tabelaFuncionarios');
      tbody.innerHTML = '';
      data.forEach(f => {
        tbody.innerHTML += `
          <tr>
            <td>${f.nome}</td>
            <td>${f.email}</td>
            <td>${f.cargo}</td>
            <td>${f.departamento}</td>
          </tr>
        `;
      });
    }

    // Cadastrar funcionário
    document.getElementById('formFuncionario').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nome = document.getElementById('nome').value;
      const email = document.getElementById('email').value;
      const cargo = document.getElementById('cargo').value;
      const departamento = document.getElementById('departamento').value;

      const { error } = await _supabase.from('funcionarios').insert([{ nome, email, cargo, departamento }]);
      
      if (error) {
        alert('Erro ao cadastrar: ' + error.message);
      } else {
        e.target.reset();
        carregarFuncionarios();
      }
    });

    // Inicializar o controle de acesso
    verificarSessao();
  </script>
</body>
</html>
